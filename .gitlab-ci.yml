workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^ci\/(batch|local)-/
    - if: $CI_COMMIT_TAG

default:
  tags: [docker]

check:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.24
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git >/dev/null
    - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
    - |
      if [ "$base" = "0000000000000000000000000000000000000000" ]; then
        if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
          echo "cannot identify a root commit in a shallow clone" >&2
          exit 1
        fi
        head=$(git rev-parse HEAD) || exit 1
        ancestry=$(git rev-list --parents -n 1 HEAD) || exit 1
        if [ "$ancestry" = "$head" ]; then
          echo "root commit: no previous commit"
          exit 0
        fi
        base=$(git rev-parse --verify HEAD^) || exit 1
      fi
      if [ -z "$base" ]; then
        echo "missing diff base" >&2
        exit 1
      elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
        echo "diff base is not available in the full clone" >&2
        exit 1
      else
        git diff --check "$base" HEAD
      fi


variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "0"
  COMPOSER_POLICY_ADVISORIES_BLOCK: "1"
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  XDEBUG_MODE: "off"

.php:
  retry:
    max: 1
    exit_codes: [100]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/chialab/php:${PHP_RUNTIME}
  timeout: 20m
  cache:
    key: composer-$CI_JOB_NAME_SLUG
    paths:
      - .cache/composer/
  before_script:
    - php --version
    - test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "$PHP_RUNTIME"
    - |
      if ! php -r 'exit(extension_loaded("pcntl") ? 0 : 1);'; then
        install-php-extensions pcntl
      fi
    - php -r 'foreach (["dom","curl","libxml","mbstring","zip","pcntl","pdo","sqlite3","pdo_sqlite","bcmath","soap","intl","gd","exif","iconv","fileinfo"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension ".$extension."\n"); exit(1); } }'
    - |
      curl --fail --silent --show-error --location https://getcomposer.org/download/2.11.1/composer.phar --output "$CI_PROJECT_DIR/.ci-composer.phar"
      printf '%s  %s\n' 6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c "$CI_PROJECT_DIR/.ci-composer.phar" | sha256sum --check --status
      composer() { php "$CI_PROJECT_DIR/.ci-composer.phar" "$@"; }
      export COMPOSER_HOME="$CI_PROJECT_DIR/.ci-composer-home"
      mkdir -p "$COMPOSER_HOME"
      chmod 0700 "$COMPOSER_HOME"
      composer --version
      composer validate --strict
      composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      composer audit --locked --format=json > composer-audit.json
    - |
      php <<'PHP'
      <?php
      require 'vendor/autoload.php';
      foreach (['laravel/framework' => '13', 'orchestra/testbench' => '11', 'pestphp/pest' => '4', 'phpunit/phpunit' => '12', 'larastan/larastan' => '3'] as $package => $major) {
          $version = Composer\InstalledVersions::getVersion($package);
          echo $package.' '.$version.PHP_EOL;
          if (!str_starts_with($version, $major.'.')) {
              exit(1);
          }
      }
      PHP
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - composer-audit.json

tests:
  extends: .php
  parallel:
    matrix:
      - PHP_RUNTIME: ["8.5"]
  script:
    - vendor/bin/pest --ci --parallel --log-junit junit.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - composer-audit.json
      - junit.xml
    reports:
      junit: junit.xml

phpstan:
  extends: .php
  variables:
    PHP_RUNTIME: "8.5"
  script:
    - composer analyse -- --memory-limit=1G

pint:
  extends: .php
  variables:
    PHP_RUNTIME: "8.5"
  script:
    - vendor/bin/pint --test
